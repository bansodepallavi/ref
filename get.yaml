get:
  summary: Get user by ID
  operationId: getUserById
  parameters:
    - name: id
      in: path
      required: true
      description: User identifier
      schema:
        type: integer
  responses:
    "200":
      description: User found
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: integer
                example: 123
              name:
                type: string
                example: John Doe
    "404":
      description: User not found
